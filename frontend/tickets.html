<div class="container">
  <h1 class="page-title">Tickets de anomalías</h1>
  <p class="page-subtitle">Cada anomalía es un ticket: se notifica a operaciones, se cierra cuando está informada, o se rechaza si es falsa alarma.</p>

  <div class="card" style="margin-bottom:14px;">
    <div class="tk-filtros">
      <div class="filtro-campo">
        <label for="tkDias">Período</label>
        <select id="tkDias">
          <option value="7">Últimos 7 días</option>
          <option value="30" selected>Últimos 30 días</option>
          <option value="90">Últimos 90 días</option>
        </select>
      </div>
      <div class="filtro-campo">
        <label for="tkCliente">Flota / Cliente</label>
        <select id="tkCliente"><option value="">Todas las flotas</option></select>
      </div>
      <div class="filtro-campo">
        <label for="tkBuscar">Buscar</label>
        <input type="text" id="tkBuscar" placeholder="Patente, ticket, observación…">
      </div>
    </div>
  </div>

  <div id="tkLoading" class="loading-state">Cargando tickets…</div>
  <div id="tkContenido" class="hidden">
    <div id="tkStats" class="kpi-fila"></div>
    <div class="tk-pestanas" id="tkPestanas"></div>
    <div class="card"><div id="tkTabla"></div></div>
  </div>
</div>
